# v で始まるタグの push で、.vsix を作って Release に添付する。ノートは CHANGELOG.md の該当するバージョンの節から作る。
# Secrets に VSCE_PAT（Visual Studio Marketplace）と OVSX_PAT（Open VSX）があれば、それぞれに公開する。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 公開の手順を、トークンがあるときだけ実行するため（if では secrets を直接参照できない）
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          # タグのコミットが main に含まれるかを確かめるので、履歴をすべて取得する
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # package.json のバージョンと違うタグや、main に入っていないコミットのタグでは作らない
      - name: Check tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version " 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
          cat >> notes.md <<NOTES

          ## インストール

          \`hushmark-$version.vsix\` をダウンロードし、VSCode のコマンドパレットの「Extensions: Install from VSIX...」で選びます。詳しくは README を参照してください。
          NOTES
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "hushmark-$version.vsix" --title "Hushmark $version" --notes-file notes.md --verify-tag
      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath "hushmark-${GITHUB_REF_NAME#v}.vsix"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.2.0 publish "hushmark-${GITHUB_REF_NAME#v}.vsix" -p "$OVSX_PAT"
