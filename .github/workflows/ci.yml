# 単体テストと E2E テスト。E2E は Linux ではすべて、macOS と Windows ではスモークテストだけを実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # テストに使う VSCode（test/e2e/vscode.mjs の VSCODE_VERSION）を、ダウンロードし直さずに使う
      - uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/e2e/vscode.mjs') }}
      # 表示幅や見出しの高さを確かめるので、日本語のフォントを入れる
      - name: Install Japanese fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      # Ubuntu 24.04 は AppArmor で一般のユーザーが名前空間を作るのを制限しており、VSCode（Chromium）が
      # サンドボックスを作れずに起動しない。使い捨ての CI のマシンなので、制限を外す
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: E2E (all)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- all
      - name: E2E (smoke)
        if: runner.os != 'Linux'
        run: npm run test:e2e -- smoke
      # 失敗したときは、VSCode と拡張のログ（hushmark.debugLog を有効にしている）を残す
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            .e2e/vscode.log
            .e2e/ud/logs
